[dmenu]
dmenu_command = rofi -no-config -no-lazy-grab -dmenu -i -theme ~/.config/polybar/cuts/scripts/rofi/launcher.rasi
highlight = True
wifi_icons = 󰤯󰤟󰤢󰤥󰤨
format = {name} {sec} {icon}
prompt = Networks

[dmenu_passphrase]
obscure = True

[editor]
terminal = kitty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
show_notifications = True
